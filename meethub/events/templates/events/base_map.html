{% extends 'events/base.html' %}

{% block content %}
<div class="container-fluid" style="padding: 0;">
    <div class="row" style="margin: 0;">
        <!-- Map Column -->
        <div class="col-lg-7 col-md-6" style="padding: 0;">
            <div id="map" style="height: 100vh; width: 100%;"></div>
        </div>
        
        <!-- Sidebar Content Column -->
        <div class="col-lg-5 col-md-6" style="height: 100vh; overflow-y: auto; padding: 20px; background-color: #f8f9fa;">
            {% block sidebar_content %}
            {% endblock %}
        </div>
    </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
     crossorigin=""/>

{% block map_extra_css %}
<style>
    .bg-gradient-primary {
        background: linear-gradient(45deg, var(--primary-color), #8b5cf6);
    }
    
    #map {
        z-index: 1;
    }
    
    .card {
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
</style>
{% endblock %}

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
        crossorigin=""></script>

{% block map_init_script %}
<script>
    // Initialize map
    const map = L.map('map').setView([40.7128, -74.0060], 13); // Default to NYC
    
    // Add OpenStreetMap tiles (no API key required for basic usage)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    
    // Get user's location
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                map.setView([lat, lon], 13);
                
                // Add user location marker
                L.circleMarker([lat, lon], {
                    radius: 8,
                    fillColor: '#4285F4',
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(map).bindPopup('Your Location');
            },
            function(error) {
                console.log('Geolocation error:', error.message);
                // Keep default view if geolocation fails
            }
        );
    }
</script>
{% endblock %}

{% block map_extra_js %}
{% endblock %}
{% endblock %}
